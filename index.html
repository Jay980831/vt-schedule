<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTuber 直播時間軸 & 多人週表</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 glass-card border-b border-slate-800 bg-slate-900/80">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i data-lucide="tv" class="w-6 h-6 text-pink-500"></i>
                <h1 class="text-lg font-bold bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">
                    VTuber 視訊時間軸
                </h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="toggleModal('uploadModal')" class="px-3 py-1.5 text-sm bg-pink-600 hover:bg-pink-500 rounded-lg flex items-center space-x-1 transition font-medium">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">上傳週表</span>
                </button>
                <button onclick="toggleModal('addEventModal')" class="px-3 py-1.5 text-sm bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg flex items-center space-x-1 transition">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">新增行程</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-4 space-y-6">

        <!-- Controls / Filters -->
        <section class="glass-card p-4 rounded-xl space-y-3">
            <div class="flex items-center space-x-2 overflow-x-auto hide-scrollbar pb-1" id="groupTabs">
                <button onclick="filterGroup('全部')" class="group-btn active px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-pink-600 text-white">全部團隊</button>
                <button onclick="filterGroup('子午計畫')" class="group-btn px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 hover:bg-slate-700">子午計畫</button>
                <button onclick="filterGroup('箱外/個人勢')" class="group-btn px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 hover:bg-slate-700">箱外/個人勢</button>
                <button onclick="filterGroup('彩虹社')" class="group-btn px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 hover:bg-slate-700">彩虹社</button>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-sm">
                <div class="flex items-center space-x-2">
                    <i data-lucide="calendar" class="w-4 h-4 text-pink-400"></i>
                    <input type="month" id="monthPicker" value="2026-09" onchange="renderTimeline()" class="bg-slate-800 border border-slate-700 rounded-md px-2 py-1 text-xs text-slate-200 focus:outline-none">
                </div>
                <button onclick="clearAllData()" class="text-xs text-red-400 hover:underline flex items-center space-x-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    <span>清空所有行程</span>
                </button>
            </div>
        </section>

        <!-- Timeline Section -->
        <section id="timelineContainer" class="space-y-6">
            <!-- Dynamic Content -->
        </section>

    </main>

    <!-- Upload Week Table Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-lg rounded-2xl p-5 space-y-4 border border-slate-700">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base flex items-center space-x-2">
                    <i data-lucide="image" class="w-5 h-5 text-pink-400"></i>
                    <span>上傳 VTuber 週表圖片</span>
                </h3>
                <button onclick="toggleModal('uploadModal')" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Upload Drop Area -->
            <div id="dropZone" onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-slate-700 hover:border-pink-500 rounded-xl p-6 text-center space-y-2 transition cursor-pointer bg-slate-900/40">
                <i data-lucide="upload-cloud" class="w-10 h-10 text-pink-400 mx-auto"></i>
                <p class="text-xs text-slate-200 font-medium">點擊選擇圖片、拖曳圖片至此，或按 <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-600 rounded text-[10px]">Ctrl + V</kbd> 貼上圖片</p>
                <p class="text-[10px] text-slate-400">支援 JPG / PNG / WEBP 格式</p>
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
            </div>

            <!-- Image Preview Box -->
            <div id="previewContainer" class="hidden space-y-2">
                <div class="text-xs text-slate-400 flex justify-between items-center">
                    <span>已選擇的週表圖片：</span>
                    <button onclick="clearImagePreview()" class="text-red-400 hover:underline text-[11px]">移除圖片</button>
                </div>
                <div class="relative max-h-48 overflow-hidden rounded-lg border border-slate-700 bg-slate-900">
                    <img id="imagePreview" class="w-full object-contain max-h-48" src="" alt="預覽">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs text-slate-400">Gemini API Key (貼上 API 金鑰):</label>
                <input type="password" id="apiKey" placeholder="請貼上您的 Gemini API Key..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="toggleModal('uploadModal')" class="px-4 py-2 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">取消</button>
                <button id="processBtn" onclick="processAIUpload()" class="px-4 py-2 text-xs rounded-lg bg-pink-600 hover:bg-pink-500 font-semibold flex items-center space-x-1">
                    <i data-lucide="wand2" class="w-3.5 h-3.5"></i>
                    <span id="btnText">開始 AI 辨識週表</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Manual Add Event Modal -->
    <div id="addEventModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-md rounded-2xl p-5 space-y-4 border border-slate-700">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base">新增直播行程</h3>
                <button onclick="toggleModal('addEventModal')" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="addEventForm" onsubmit="saveEvent(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">VTuber 名稱</label>
                    <input type="text" id="vtuberName" required placeholder="例如：稀有礦物 / 汐Seki" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">所屬社團/箱別</label>
                        <select id="vtuberGroup" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200">
                            <option value="子午計畫">子午計畫</option>
                            <option value="箱外/個人勢">箱外/個人勢</option>
                            <option value="彩虹社">彩虹社</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">直播分類</label>
                        <select id="eventType" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200">
                            <option value="歌枠">歌枠</option>
                            <option value="雜談">雜談</option>
                            <option value="遊戲">遊戲</option>
                            <option value="重大發表">重大發表</option>
                            <option value="聯動">聯動</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">日期</label>
                        <input type="date" id="eventDate" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">時間</label>
                        <input type="time" id="eventTime" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">直播標題</label>
                    <input type="text" id="eventTitle" required placeholder="例如：【歌枠】深夜來唱歌吧！" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">YouTube / 直播連結 (選填)</label>
                    <input type="url" id="eventLink" placeholder="https://youtube.com/..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200">
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="toggleModal('addEventModal')" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300">取消</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-pink-600 hover:bg-pink-500 font-semibold">儲存行程</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let events = JSON.parse(localStorage.getItem('vtuber_events') || '[]');
        let activeGroup = '全部';
        let currentBase64Image = null;
        let currentMimeType = 'image/png';

        // Clipboard Paste Listener (Ctrl+V)
        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    const file = item.getAsFile();
                    processImageFile(file);
                    document.getElementById('uploadModal').classList.remove('hidden');
                    break;
                }
            }
        });

        // Drag & Drop Listener
        const dropZone = document.getElementById('dropZone');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone?.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        dropZone?.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) processImageFile(files[0]);
        });

        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) processImageFile(files[0]);
        }

        function processImageFile(file) {
            currentMimeType = file.type || 'image/png';
            const reader = new FileReader();
            reader.onload = (e) => {
                currentBase64Image = e.target.result;
                document.getElementById('imagePreview').src = currentBase64Image;
                document.getElementById('previewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearImagePreview() {
            currentBase64Image = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('previewContainer').classList.add('hidden');
        }

        async function processAIUpload() {
            if (!currentBase64Image) {
                alert('請先選擇、貼上或拖曳上傳一張週表圖片！');
                return;
            }

            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert('請貼上有效的 Gemini API Key！');
                return;
            }

            const btnText = document.getElementById('btnText');
            btnText.innerText = '尋找可用模型中...';

            try {
                // 1. 動態取得您 API Key 支援的所有模型清單
                let selectedModel = 'gemini-2.5-flash'; // 預設備用模型
                try {
                    const listUrl = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
                    const listRes = await fetch(listUrl);
                    if (listRes.ok) {
                        const listData = await listRes.json();
                        if (listData.models && listData.models.length > 0) {
                            // 篩選出支援 generateContent 的模型
                            const available = listData.models.filter(m => 
                                m.supportedGenerationMethods && 
                                m.supportedGenerationMethods.includes('generateContent')
                            );
                            
                            // 優先尋找名稱有 flash 的模型 (例如 gemini-2.5-flash, gemini-3.8-flash, gemini-2.0-flash)
                            const flashModel = available.find(m => m.name.toLowerCase().includes('flash'));
                            if (flashModel) {
                                selectedModel = flashModel.name.replace('models/', '');
                            } else if (available.length > 0) {
                                selectedModel = available[0].name.replace('models/', '');
                            }
                        }
                    }
                } catch (e) {
                    console.warn('無法動態取得模型清單，使用預設模型', e);
                }

                btnText.innerText = `使用 ${selectedModel} 分析中...`;

                // 2. 發送圖片辨識請求
                const base64Data = currentBase64Image.split(',')[1];
                const promptText = `Extract VTuber stream schedule from the image into a JSON array. 
Fields required for each item:
- "name": Name of the VTuber
- "group": Group name, default to "子午計畫" or "箱外/個人勢"
- "type": Choose one from ("歌枠", "雜談", "遊戲", "重大發表", "聯動")
- "date": Date in "YYYY-MM-DD" format (assume year 2026 if not specified)
- "time": Start time in "HH:MM" 24-hour format
- "title": Stream title or description`;

                const generateUrl = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`;
                
                const response = await fetch(generateUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: currentMimeType, data: base64Data } }
                            ]
                        }]
                    })
                });

                const resJson = await response.json();

                if (!response.ok) {
                    const errorMsg = resJson.error?.message || `HTTP 錯誤 ${response.status}`;
                    throw new Error(errorMsg);
                }

                if (!resJson.candidates || !resJson.candidates[0]?.content?.parts[0]?.text) {
                    throw new Error('AI 回傳資料結構異常，請重新嘗試');
                }

                const rawText = resJson.candidates[0].content.parts[0].text;
                const cleanJsonStr = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                const jsonMatch = cleanJsonStr.match(/\[[\s\S]*\]/);
                
                if (!jsonMatch) {
                    throw new Error('未能在 AI 回應中解析出正確的 JSON 節目陣列');
                }

                const parsedEvents = JSON.parse(jsonMatch[0]);

                if (Array.isArray(parsedEvents) && parsedEvents.length > 0) {
                    parsedEvents.forEach(e => {
                        events.push({
                            id: Date.now() + Math.random(),
                            name: e.name || 'VTuber',
                            group: e.group || '子午計畫',
                            type: e.type || '雜談',
                            date: e.date || '2026-09-30',
                            time: e.time || '20:00',
                            title: e.title || '直播節目',
                            link: '#'
                        });
                    });

                    saveAndRender();
                    alert(`🎉 成功使用 ${selectedModel} 辨識並匯入 ${parsedEvents.length} 筆直播行程！`);
                } else {
                    alert('AI 已讀取圖片，但未能找到明確的節目行程資訊。');
                }

            } catch (err) {
                console.error('API 錯誤細節:', err);
                alert(`辨識失敗！Google API 回傳：\n${err.message}`);
            } finally {
                btnText.innerText = '開始 AI 辨識週表';
                toggleModal('uploadModal');
                clearImagePreview();
            }
        }
        function clearAllData() {
            if (confirm('確定要清空目前所有的直播行程嗎？')) {
                events = [];
                saveAndRender();
            }
        }

        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden');
        }

        function filterGroup(groupName) {
            activeGroup = groupName;
            document.querySelectorAll('.group-btn').forEach(btn => {
                if (btn.innerText === groupName || (groupName === '全部' && btn.innerText.includes('全部'))) {
                    btn.className = "group-btn active px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-pink-600 text-white";
                } else {
                    btn.className = "group-btn px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 hover:bg-slate-700";
                }
            });
            renderTimeline();
        }

        function saveEvent(e) {
            e.preventDefault();
            const newEvent = {
                id: Date.now(),
                name: document.getElementById('vtuberName').value,
                group: document.getElementById('vtuberGroup').value,
                type: document.getElementById('eventType').value,
                date: document.getElementById('eventDate').value,
                time: document.getElementById('eventTime').value,
                title: document.getElementById('eventTitle').value,
                link: document.getElementById('eventLink').value || '#'
            };
            events.push(newEvent);
            saveAndRender();
            toggleModal('addEventModal');
            document.getElementById('addEventForm').reset();
        }

        function deleteEvent(id) {
            events = events.filter(e => e.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('vtuber_events', JSON.stringify(events));
            renderTimeline();
        }

        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            const selectedMonth = document.getElementById('monthPicker').value;

            const filtered = events.filter(e => {
                const matchMonth = e.date.startsWith(selectedMonth);
                const matchGroup = activeGroup === '全部' || e.group === activeGroup;
                return matchMonth && matchGroup;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-10 rounded-2xl text-center space-y-3">
                        <i data-lucide="calendar-x" class="w-12 h-12 text-slate-500 mx-auto"></i>
                        <p class="text-sm text-slate-400">目前沒有任何節目行程，請點選右上角上傳週表或手動新增行程。</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const groupedByDate = {};
            filtered.sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time)).forEach(e => {
                if (!groupedByDate[e.date]) groupedByDate[e.date] = [];
                groupedByDate[e.date].push(e);
            });

            let html = '';
            for (const [date, dayEvents] of Object.entries(groupedByDate)) {
                const dateObj = new Date(date);
                const dayOfWeek = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'][dateObj.getDay()];

                html += `
                    <div class="space-y-3">
                        <div class="flex items-center space-x-2 border-b border-slate-800 pb-2">
                            <span class="text-sm font-bold text-pink-400">${date}</span>
                            <span class="text-xs text-slate-400">(${dayOfWeek})</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                `;

                dayEvents.forEach(e => {
                    const badgeColors = {
                        '歌枠': 'bg-pink-500/20 text-pink-300 border-pink-500/30',
                        '雜談': 'bg-blue-500/20 text-blue-300 border-blue-500/30',
                        '遊戲': 'bg-purple-500/20 text-purple-300 border-purple-500/30',
                        '重大發表': 'bg-red-500/20 text-red-300 border-red-500/30',
                        '聯動': 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'
                    };

                    html += `
                        <div class="glass-card p-3.5 rounded-xl flex flex-col justify-between space-y-2 hover:border-slate-700 transition relative group">
                            <div class="flex items-start justify-between">
                                <div class="flex items-center space-x-2">
                                    <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs text-pink-400">
                                        ${e.name.substring(0, 1)}
                                    </div>
                                    <div>
                                        <div class="font-semibold text-xs text-slate-200">${e.name}</div>
                                        <div class="text-[10px] text-slate-400">${e.group}</div>
                                    </div>
                                </div>
                                <span class="px-2 py-0.5 rounded text-[10px] border ${badgeColors[e.type] || 'bg-slate-800 text-slate-300'}">
                                    ${e.type}
                                </span>
                            </div>

                            <div class="text-xs font-medium text-slate-100 line-clamp-2">
                                ${e.title}
                            </div>

                            <div class="flex items-center justify-between pt-2 border-t border-slate-800/80 text-[11px] text-slate-400">
                                <div class="flex items-center space-x-1">
                                    <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i>
                                    <span>${e.time}</span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <button onclick="deleteEvent(${e.id})" class="text-slate-500 hover:text-red-400 transition">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <a href="${e.link}" target="_blank" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded flex items-center space-x-1">
                                        <span>開啟直播</span>
                                        <i data-lucide="external-link" class="w-3 h-3"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            lucide.createIcons();
        }

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            renderTimeline();
        });
    </script>
</body>
</html>
